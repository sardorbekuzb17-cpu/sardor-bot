services:
  # Keepalive service - har 20 daqiqada Alwaysdata botni restart qiladi
  - type: web
    name: sardor-bot-keepalive
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r render_requirements.txt
    startCommand: gunicorn render_keepalive:app
    envVars:
      - key: SSH_HOST
        value: ssh-sardorsoatbot.alwaysdata.net
      - key: SSH_USER
        value: sardorsoatbot
      - key: SSH_KEY
        sync: false  # Manual: Base64 encoded private key
    healthCheckPath: /health
